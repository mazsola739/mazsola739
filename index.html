<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page has a light and a dark theme of its own: browsers must not darken it themselves. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Erika Rostás – full-stack developer. Projects from first steps to complex systems." />
    <title>Erika Rostás – Portfolio</title>
    <script>
      // Pick the theme before the first paint, so the page never flashes the wrong colors:
      // the visitor's saved choice, or the system setting when there is none.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('theme')
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
